<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'OrbitControls';
import * as DOME from './dome.mesh.js'; // hardcoded baked mesh


// ============================================================================
// [PV] PREVIEW BAKE (NOT Workbench)
// - Preview-only export wrapper to prevent conflation with Workbench bake.
// ============================================================================

function pvNowStamp() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}__${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

function pvDownloadJSON(obj, filename) {
  const json = JSON.stringify(obj, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 0);
}

function pvSafeClone(x) {
  // avoids accidental live references in the exported bake
  try { return structuredClone(x); } catch { return JSON.parse(JSON.stringify(x)); }
}

/** BAKE PREVIEW **/
function pvGetBakePlan(){
  const fps  = Math.max(1, Math.min(240, Math.floor(Engine.fps || DEFAULT_FPS)));
  const rate = _playbackRate(); // Engine.speed

  const durSim   = Number(Engine.getEffectiveDuration?.() ?? Engine.durationBase ?? 0) || 0;
  const startSim = Math.max(0, Number(getTimeStart()) || 0);
  const stopSim  = isStopFinite() ? Math.min(Number(getTimeStop()) || 0, durSim) : durSim;

  const startReal = startSim / rate;
  const stopReal  = stopSim  / rate;
  const spanReal  = Math.max(0, stopReal - startReal);

  // bake frames in REAL time at fps
  const frames = Math.max(1, Math.floor(spanReal * fps + 1e-9) + 1);

  // the one mapping that matters:
  // realSeconds -> simSeconds -> evalSeconds (trim/loop aware)
  const toEval = (tReal)=>{
    const tSim = (Number(tReal) || 0) * rate;
    return effectiveRippTimeSec(tSim);
  };

  return { fps, rate, durSim, startSim, stopSim, startReal, stopReal, frames, toEval };
}


function bakePreview(){
  if (modeSel?.value !== 'preview'){
    console.warn('[PV] Bake JSON is Preview-only.');
    return;
  }

  _syncPreviewModeFlag(); // ensure trim logic is actually in preview mode

  const plan = pvGetBakePlan();

  // Freeze time while baking so Engine.tick() can't drift underneath us
  const wasPlaying = !!Engine.playing;
  Engine.pause();

  try {
    const core =
      (typeof buildBakePayload === "function")
        ? buildBakePayload({
            mode: "preview",
            // explicit bake settings
            fps: plan.fps,
            speed: plan.rate,
            timeStartReal: plan.startReal,
            timeStopReal: plan.stopReal,
            timeStartSim: plan.startSim,
            timeStopSim: plan.stopSim,
            frames: plan.frames,
            // the critical mapping:
            toEval: plan.toEval,
            // keep face mode aligned with Preview UI
            faceMode: faceMode?.value || 'front',
          })
        : (typeof exportPreviewBakeCore === "function")
          ? exportPreviewBakeCore({ bakePlan: plan })
          : null;

    if (!core){
      console.warn("[PV] bakePreview(): No bake core found. Expected buildBakePayload(...) or exportPreviewBakeCore(...).");
      return;
    }

    const payload = (core && typeof core === 'object' && core.schema)
      ? core
      : {
          schema: "RIPPER-PREVIEW-BAKE/1.1.0",
          bakeKind: "preview",
          sourceMode: "preview",
          createdAt: new Date().toISOString(),
          settings: {
            fps: plan.fps,
            speed: plan.rate,
            timeStartReal: plan.startReal,
            timeStopReal: plan.stopReal,
            timeStartSim: plan.startSim,
            timeStopSim: plan.stopSim,
            frames: plan.frames
          },
          data: pvSafeClone(core)
        };

    const fn = `ripper_preview_bake__${pvNowStamp()}.json`;
    pvDownloadJSON(payload, fn);
    console.log(`[PV] Preview bake exported: ${fn}`, payload);

  } finally {
    if (wasPlaying) Engine.play();
  }
}



/* ---------- DOM ---------- */
const app = document.getElementById('app');
const idHud = document.getElementById('idHud');
const angHud = document.getElementById('angles');

const modeSel = document.getElementById('mode');
const seqWrap = document.getElementById('seqWrap');
const transportWrap = document.getElementById('transportWrap');
const faceWrap = document.getElementById('faceWrap');
const devToggles = document.getElementById('devToggles');

const seqSel = document.getElementById('sequence');
const loadBtn = document.getElementById('loadSeq');
const playBtn = document.getElementById('play');

function syncPlayToggleUI(){
  if (!playBtn) return;
  const isPlaying = !!Engine.playing;
  playBtn.textContent = isPlaying ? 'Pause' : 'Play';
  playBtn.title = isPlaying ? 'Pause' : 'Play';
  playBtn.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');
}

const scrub = document.getElementById('scrub');
const tVal = document.getElementById('tVal');

const timeStartInput = document.getElementById('timeStart');
const timeEndInput   = document.getElementById('timeEnd');
const timeStopInput = timeEndInput;


/* ---------- ENGINE ---------- */
const DEFAULT_FPS = window.__WB_CONSTANTS__?.DEFAULT_FPS ?? 60;

let MASTER_SPEED_DEFAULT = 1; // 1 = 100%

const Engine = globalThis.Engine = globalThis.Engine ?? {
  fps: DEFAULT_FPS,
  playing: false,
  t: 0,
  durationBase: 12,
  lastReal: 0,
  speed: MASTER_SPEED_DEFAULT,

  _lastStepIndex: -1,
  userFpsOverride: false,

  getEffectiveDuration(){
    return this.durationBase;  
  },
  getEffectiveTime(){
    return this.t;      
  },
  setEffectiveTime(tEff){
    this.t = (Number(tEff) || 0);  
  },

  syncTransportUI(){
  const rate = _playbackRate();
  const tEffSim = this.getEffectiveTime();
  const dEffSim = this.getEffectiveDuration();

  const inPreview = (modeSel.value === 'preview');

  const minSim = inPreview ? getTimeStart() : 0;
  const maxSim = inPreview
    ? (isStopFinite() ? Math.min(getTimeStop(), dEffSim) : dEffSim)
    : dEffSim;

  // sim-time the ripp sees
  const tShownSim = inPreview ? effectiveRippTimeSec(tEffSim) : tEffSim;

  // UI is REAL time
  const minUI = inPreview ? (minSim / rate) : minSim;
  const maxUI = inPreview ? (maxSim / rate) : maxSim;
  const tUI   = inPreview ? (tShownSim / rate) : tShownSim;

  scrub.min = String(minUI);
  scrub.max = String(Math.max(minUI, maxUI));
  scrub.value = String(Math.min(Math.max(tUI, minUI), maxUI));

  tVal.textContent = tUI.toFixed(2);

  // keep trim inputs showing REAL seconds (but don't fight the user while typing)
  if (inPreview){
    if (timeStartInput && document.activeElement !== timeStartInput){
      timeStartInput.value = getTimeStartUIValue();
    }
    if (timeStopInput && document.activeElement !== timeStopInput){
      timeStopInput.value = getTimeStopUIValue();
    }
  }
},


  setDuration(d){
    this.durationBase = Math.max(0, Number(d) || 0);
    this.duration = this.durationBase; // legacy compat
    this.syncTransportUI();
  },

  play(){
  this.playing = true;
  this.lastReal = performance.now() / 1000;
  const fps = (this.fps || DEFAULT_FPS);
  this._lastStepIndex = Math.floor(this.getEffectiveTime() * fps);
  syncPlayToggleUI();
  },
  pause(){
    this.playing = false;
    syncPlayToggleUI();
  },


  tick(){
  _syncPreviewModeFlag();
  const now = performance.now() * 0.001;

  // Real dt (clamped) — safe if lastReal is undefined/NaN
  let dtReal = now - this.lastReal;
  if (!Number.isFinite(dtReal) || dtReal < 0) dtReal = 0;
  dtReal = Math.min(dtReal, 0.25);

  // Always update lastReal so pauses/tab-inactive don't accumulate a huge dt on resume
  this.lastReal = now;

  if (!this.playing) return;

  // Advance transport time safely
  const speed = Number.isFinite(this.speed) ? this.speed : 1;
  if (!Number.isFinite(this.t)) this.t = 0;
  this.t += dtReal * speed;

  if (modeSel.value === 'preview' && isStopFinite()) {
  const stopSim = Math.min(getTimeStop(), this.getEffectiveDuration());

  if (this.t >= stopSim) {
    this.t = stopSim;
    this.pause();        // stop playback at trim end
  }
  }


  this.syncTransportUI();

  // Only drive ripps in Preview (not Workbench)
  if (modeSel.value !== 'preview') return;

  const fps = Math.max(1, Math.min(240, Math.floor(this.fps || DEFAULT_FPS)));
  const tEffNow = this.getEffectiveTime();
  if (!Number.isFinite(tEffNow)) return;

  const targetStepIndex = Math.floor(tEffNow * fps + 1e-9);

  const loopOn = isLoopActive();
  const spanSec = loopOn ? Math.max(0, Number(getTrimSpan()) || 0) : 0;
  const spanSteps = (loopOn && spanSec > 0) ? Math.max(1, Math.round(spanSec * fps)) : 0;

  // Init/reset path
  if (!Number.isFinite(this._lastStepIndex) || this._lastStepIndex == null || this._lastStepIndex < 0){
    this._lastStepIndex = targetStepIndex;

    const tEval0 = effectiveRippTimeSec(tEffNow);
    SequenceManager._lastEvalT = tEval0;
    SequenceManager.update(tEval0, 0);


    applyPreviewColors();
    return;
  }

  let lastStepIndex = this._lastStepIndex;
  let deltaSteps = targetStepIndex - lastStepIndex;

  // Continuous eval time (lets ripps interpolate smoothly)
  const tEvalNow = effectiveRippTimeSec(tEffNow);

  // dt in *eval time* should match “speed-scaled real dt”
  let dtEvalNow = dtReal * speed;

  // If you’re looping/trim-wrapping, keep dt positive across the wrap
  const prevEval = SequenceManager._lastEvalT;
  if (typeof prevEval === 'number') {
    dtEvalNow = tEvalNow - prevEval;
    if (loopOn && spanSec > 0 && dtEvalNow < 0) dtEvalNow += spanSec;
  }

  // If we did NOT cross a discrete frame boundary, still update once per RAF.
  // This is the key change that removes “slow speed = choppy”
  if (deltaSteps === 0) {
    SequenceManager._lastEvalT = tEvalNow;
    SequenceManager.update(tEvalNow, dtEvalNow);
    applyPreviewColors();
    return;
  }


  // If the effective grid wrapped, convert to a forward step count
  if (deltaSteps < 0){
    if (loopOn && spanSteps > 0){
      deltaSteps += spanSteps;
    } else {
      // Backward jump without loop => discontinuity (seek/reset). Snap with dt=0.
      this._lastStepIndex = targetStepIndex;

      const tEval = effectiveRippTimeSec(targetStepIndex / fps);
      SequenceManager._lastEvalT = tEval;

      SequenceManager.update(tEval, 0);
      applyPreviewColors();
      return;
    }
  }

  // Cap catch-up to avoid spiral-of-death (e.g. tab inactive)
  const MAX_CATCH_UP_STEPS = Math.min(240, Math.max(1, fps)); // ~1 second
  if (deltaSteps > MAX_CATCH_UP_STEPS){
    this._lastStepIndex = targetStepIndex;

    const tEval = effectiveRippTimeSec(targetStepIndex / fps);
    SequenceManager._lastEvalT = tEval;

    SequenceManager.update(tEval, 0);
    applyPreviewColors();
    return;
  }

  const dtSnapEff = 1 / fps;

  // Deterministically step through EACH missed effective grid step
  for (let i = 1; i <= deltaSteps; i++){
    let stepIndex = lastStepIndex + i;

    // Keep the stored stepIndex in-loop if looping (so next delta calc stays sane)
    if (loopOn && spanSteps > 0){
      stepIndex = stepIndex % spanSteps;
    }

    const tSnapLocal = stepIndex / fps;

    // IMPORTANT: when looping, stepIndex is loop-local (0..span), so convert to global SIM by adding start.
    const tSnapSim = (loopOn && spanSec > 0)
      ? (getTimeStart() + tSnapLocal)
      : tSnapLocal;

    // Apply trim/loop mapping to the time sent to the ripp
    const tEval = effectiveRippTimeSec(tSnapSim);


    // dt that stays “forward” even when eval time wraps
    let dtEval = dtSnapEff;
    const prevEval = SequenceManager._lastEvalT;

    if (typeof prevEval === 'number'){
      dtEval = tEval - prevEval;
      if (loopOn && spanSec > 0 && dtEval < 0) dtEval += spanSec;
    }

    SequenceManager._lastEvalT = tEval;
    SequenceManager.update(tEval, dtEval);
  }

  this._lastStepIndex = targetStepIndex;
  applyPreviewColors();
}

};


/* ---------- TRIM / LOOP WINDOW ---------- */

let timeStart = 0;          // seconds
let timeStop = null;        // null => ∞ (preferred over Infinity for UI/input)

// If you already have a preview flag elsewhere, delete this and use yours.
let isPreviewMode = false;

function _syncPreviewModeFlag(){
  isPreviewMode = (modeSel?.value === 'preview');
}
_syncPreviewModeFlag();
modeSel?.addEventListener('change', _syncPreviewModeFlag);


// --- getters
function getTimeStart() {
  return timeStart;
}
function getTimeStop() {
  return timeStop == null ? Infinity : timeStop;
}
function isStopFinite() {
  return Number.isFinite(getTimeStop());
}
function getTrimSpan() {
  const start = getTimeStart();
  const stop = getTimeStop();
  return Number.isFinite(stop) ? Math.max(0, stop - start) : Infinity;
}
function isLoopActive() {
  return !!isPreviewMode && isStopFinite() && getTrimSpan() > 0;
}

// --- setters (core)
function setTimeStartSec(v) {
  const n = Number(v);
  timeStart = Number.isFinite(n) ? Math.max(0, n) : 0;

  // Keep ordering sane if stop is finite and now below start
  if (timeStop != null && timeStop < timeStart) timeStop = timeStart;
}

function setTimeStopSec(v) {
  // Accept null/undefined/"" => ∞
  if (v == null || v === "") {
    timeStop = null;
    return;
  }
  const n = Number(v);
  timeStop = Number.isFinite(n) ? Math.max(timeStart, n) : null;
}

// --- UI-friendly helpers
function getTimeStartUIValue() {
  return _fmtUI(_simToReal(getTimeStart()));
}

function getTimeStopUIValue() {
  const stop = getTimeStop();
  return Number.isFinite(stop) ? _fmtUI(_simToReal(stop)) : "";
}


// Map “global time” -> “time used to evaluate the ripp”
function effectiveRippTimeSec(tSec) {
  const t = Number(tSec);
  const start = getTimeStart();
  const stop = getTimeStop();

  const unclamped = Number.isFinite(t) ? t : 0;
  const base = Math.max(start, unclamped);

  // If no stop (∞) or not preview, just return base
  if (!isPreviewMode || !Number.isFinite(stop)) return base;

  // CLAMP (not wrap)
  return Math.min(base, stop);
}


// Call this whenever a new ripp is loaded
function resetTrimWindowForNewRipp() {
  timeStart = 0;
  timeStop = null; // ∞
}

function _reEvalPreviewNow(){
  if (modeSel.value !== 'preview') return;
  if (!SequenceManager.current) return;

  const tEff = Engine.getEffectiveTime();
  const tEval = effectiveRippTimeSec(tEff);

  SequenceManager._lastEvalT = tEval;
  SequenceManager.current.update?.(SceneAPI, tEval, 0);
  applyPreviewColors();
  Engine.syncTransportUI();
}

// Trim inputs (UI is REAL seconds; internal is SIM seconds)
timeStartInput?.addEventListener('input', ()=>{
  const uiReal = _parseUI(timeStartInput.value);
  setTimeStartSec(_realToSim(uiReal));

  // snap engine time up to start (SIM) to avoid “stuck at start”
  const minSim = getTimeStart();
  if (Engine.getEffectiveTime() < minSim) Engine.setEffectiveTime(minSim);

  _reEvalPreviewNow();
});

timeStopInput?.addEventListener('input', ()=>{
  const raw = String(timeStopInput.value ?? "").trim();
  const n = Number(raw);

  // Treat empty OR non-positive as "no stop" (∞)
  if (raw === "" || (!Number.isNaN(n) && n <= 0)){
    setTimeStopSec(""); // ∞
  } else {
    setTimeStopSec(_realToSim(_parseUI(raw)));
  }

  _reEvalPreviewNow();
});



// Scrub: scrub value is in REAL seconds (convert to SIM)
scrub?.addEventListener('input', ()=>{
  const tReal = Number(scrub.value) || 0;
  Engine.setEffectiveTime(_realToSim(tReal));
  Engine.pause(); // optional
  _reEvalPreviewNow();
});


function _playbackRate(){
  const r = Number(Engine?.speed);
  return (Number.isFinite(r) && r > 0) ? r : 1;
}
function _simToReal(s){ return (Number(s) || 0) / _playbackRate(); }
function _realToSim(r){ return (Number(r) || 0) * _playbackRate(); }

// nice compact numeric string (no trailing zeros)
function _fmtUI(sec){
  const n = Number(sec);
  if (!Number.isFinite(n)) return "0";
  return String(+n.toFixed(6)); // + trims trailing zeros
}
function _parseUI(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}



/* ---------- FPS ---------- */

const fpsInput = document.getElementById('fpsInput');
const fpsVal   = document.getElementById('fpsVal'); // <- important

function _clampInt(n, lo, hi){
  n = Math.floor(Number(n));
  if (!Number.isFinite(n)) return lo;
  return Math.min(hi, Math.max(lo, n));
}

function setFPS(next, { silent=false } = {}){
  const defaultFps = window.__WB_CONSTANTS__?.DEFAULT_FPS ?? 60;
  const current = Number(Engine.fps);
  const fps = _clampInt(next ?? (Number.isFinite(current) ? current : defaultFps), 1, 240);

  Engine.userFpsOverride = true;
  Engine.fps = fps;
  Engine._lastStepIndex = Math.floor(Engine.getEffectiveTime() * fps);

  if (fpsVal) fpsVal.textContent = String(fps);
  if (fpsInput) fpsInput.value = String(fps);

  if (globalThis.SequenceManager?.meta) globalThis.SequenceManager.meta.fps = fps;

  if (!silent){
    try { localStorage.setItem('ripper_fps', String(fps)); } catch(e){}
  }
}

// boot: restore saved FPS (or default)
try {
  const saved = Number(localStorage.getItem('ripper_fps'));
  setFPS(Number.isFinite(saved) ? saved : (window.__WB_CONSTANTS__?.DEFAULT_FPS ?? 60), { silent:true });
} catch(e){
  setFPS(globalThis.DEFAULT_FPS, { silent:true });
}

function clamp(n, lo, hi){ return Math.min(hi, Math.max(lo, n)); }

function setSpeedPct(pct, { silent=false } = {}){
  const p = clamp(Number(pct) || 100, 5, 1000);
  const mult = p / 100;

  // UI
  if (speedPct) speedPct.value = String(Math.round(p));
  if (speedVal) speedVal.textContent = `${Math.round(p)}%`;

  // keep existing internal behavior alive:
  // anything reading #speed.value still gets multiplier (0.25..4)
  if (speed) speed.value = String(mult);

  if (!silent && speed){
    // trigger any existing listeners you already have on the old slider
    speed.dispatchEvent(new Event('input', { bubbles:true }));
    speed.dispatchEvent(new Event('change', { bubbles:true }));
  }
}

// default to 100% on boot

function previewSpeedPct(raw){
  const n = Number(raw);
  if (!Number.isFinite(n)) return;
  const p = clamp(n, 25, 1000);
  const mult = p / 100;

  if (speedVal) speedVal.textContent = `${Math.round(p)}%`;
  Engine.speed = mult;
  Engine.syncTransportUI();

}

function commitSpeedPct(){
  const pct  = clamp(Number(speedPct.value) || 100, 5, 1000);
  setSpeedPct(pct);                 // keeps UI consistent
  const mult = pct / 100;

  MASTER_SPEED_DEFAULT = mult;      // if you want a “default” variable
  Engine.speed = mult;              // <-- this is what actually affects playback
  Engine.syncTransportUI();
}

/* ---------- Exporter (JSON — sRGB, 3-dec, alpha default=1) ---------- */
function toExportRGBA(id, rgba){
  const rgb_srgb = encodeLinearRGBtoSRGB(rgba);
  const a = SceneAPI._explicitAlpha.has(id) ? clamp01(rgba[3]) : 1.0;
  return [ quantize(rgb_srgb[0]), quantize(rgb_srgb[1]), quantize(rgb_srgb[2]), quantize(a) ];
}



/* --------------BAKE JSON ---------------------*/
async function bakeToJSON(){
  const EMIT_EVERY_FRAME = true; 

  if (modeSel.value !== 'preview'){
    alert('Bake JSON is only available in Preview mode.');
    return;
  }

  // Duration stays derived (no duration prompt)
  const duration = Number(SequenceManager.meta?.duration ?? Engine.duration ?? 12);
  if (!isFinite(duration) || duration <= 0){
    alert('Invalid duration (meta/engine).');
    return;
  }

  const fps = parseInt(SequenceManager.meta?.fps || Engine.fps || DEFAULT_FPS, 10) || DEFAULT_FPS;

  let playbackRate = Number(Engine?.speed);
  if (!Number.isFinite(playbackRate) || playbackRate <= 0) playbackRate = 1;


  // ---- Sampling controls ----
  const FRAME_STEP = 1;
  const COLOR_EPS = 1 / 255;

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const safeBase = (s) => String(s ?? 'ripp')
    .trim()
    .replace(/\s+/g, '_')
    .replace(/[\\/:*?"<>|]+/g, '_')
    .replace(/_+/g, '_');

  // Reset ripp to a clean state
  SequenceManager.current?.init?.(SceneAPI);

  const panels = domeMeta?.panels || [];
  if (!SequenceManager.current || panels.length === 0){
    alert('No ripp loaded or domeMeta.panels is empty.');
    return;
  }

  // ---- Preview trim window ----
  const startRaw = Number(getTimeStart?.() ?? 0);
  const stopFinite = Boolean(isStopFinite?.());
  const stopRaw = stopFinite ? Number(getTimeStop?.()) : null;

  const startSec = isFinite(startRaw) ? clamp(startRaw, 0, duration) : 0;

  let stopSec = null;
  if (stopFinite){
    if (!isFinite(stopRaw)){
      alert('Invalid timeStop');
      return;
    }
    stopSec = clamp(stopRaw, 0, duration);
    if (stopSec <= startSec){
      alert(`Invalid trim window: timeStop (${stopSec}) must be > timeStart (${startSec}).`);
      return;
    }
  }

  const evalStart = startSec;
  const evalEnd   = stopFinite ? stopSec : duration;

  const bakedSpanSec = Math.max(0, evalEnd - evalStart);   // simulated span
  const bakedWallSpanSec = bakedSpanSec / playbackRate;    // exported (wall) span after speed

  // -------- file name prompt (repurposed dialog) --------
  const rippName = safeBase(
    SequenceManager.meta?.name ||
    SequenceManager.meta?.id   ||
    seqSel?.value              ||
    'ripp'
  );

  // seconds: pretty float (e.g. 2.5 instead of 2.500)
  const fmtFloat = (n, decimals = 3) => {
    const s = Number(n).toFixed(decimals);
    return s.replace(/\.?0+$/, ''); // strip trailing zeros + trailing dot
  };

  const secondsTag = fmtFloat(bakedWallSpanSec, 3);          // "2.5"
  const speedPctTag = `${Math.round(playbackRate * 100)}%`;  // "100%"

  const suggestedName = `${rippName}-${secondsTag}-${speedPctTag}.json`;

  const nameIn = prompt('Bake file name:', suggestedName);
  if (nameIn === null) return;

  let fileName = nameIn.trim() || suggestedName;
  if (!/\.json$/i.test(fileName)) fileName += '.json';


  // Use ceil so we don't accidentally miss the end; we clamp eval time anyway.
  const lastFrame = Math.ceil(bakedWallSpanSec * fps);

  const events = [];
  const lastColors = new Map(); // id -> [r,g,b,a] linear

  const readRGBA = (id) => {
    const src = (SceneAPI._rgbaById.get(id) || [1, 1, 1, 1]);
    const r = (src[0] ?? 1);
    const g = (src[1] ?? 1);
    const b = (src[2] ?? 1);
    const a = (src[3] ?? 1);
    return [r, g, b, a];
  };

  const pushEvent = (t, set) => {
    set = set || {};
    if (!EMIT_EVERY_FRAME && Object.keys(set).length === 0) return;
    events.push({ t: +t.toFixed(6), set });
  };

  // ---- Initial full sample at exported tOut=0 (evaluated at evalStart) ----
  SequenceManager.current.update?.(SceneAPI, evalStart, 0);

  const set0 = {};
  for (const p of panels){
    const rgba = readRGBA(p.id);
    lastColors.set(p.id, rgba);
    set0[p.id] = { rgba: toExportRGBA(p.id, rgba), space: 'srgb' };
  }
  events.push({ t: 0, set: set0 });

  // ---- Stepped sampling (WALL sampling, SIM evaluation) ----
  let prevEvalT = evalStart;

  for (let frame = FRAME_STEP; frame <= lastFrame; frame += FRAME_STEP){
    const wallT = frame / fps;                      // exported timeline (seconds)
    const tEval = evalStart + wallT * playbackRate; // simulated evaluation time
    const tEvalClamped = Math.min(tEval, evalEnd);

    const dtEval = tEvalClamped - prevEvalT;
    prevEvalT = tEvalClamped;

    SequenceManager.current.update?.(SceneAPI, tEvalClamped, dtEval);

    const set = {};
    let changedAny = false;

    for (const p of panels){
      const rgba = readRGBA(p.id);
      const prev = lastColors.get(p.id);

      const changed = !prev
        || Math.abs(rgba[0] - prev[0]) > COLOR_EPS
        || Math.abs(rgba[1] - prev[1]) > COLOR_EPS
        || Math.abs(rgba[2] - prev[2]) > COLOR_EPS
        || Math.abs(rgba[3] - prev[3]) > COLOR_EPS;

      if (changed){
        lastColors.set(p.id, rgba);
        set[p.id] = { rgba: toExportRGBA(p.id, rgba), space: 'srgb' };
        changedAny = true;
      }
    }

    if (changedAny){
      pushEvent(wallT, set);
    } else if (EMIT_EVERY_FRAME){
      pushEvent(wallT, {}); // frame marker (holds previous values)
    }

    if (tEvalClamped >= evalEnd) break;
  }

  // ---- Force one last eval exactly at evalEnd ----
  if (prevEvalT < evalEnd){
    const dtEval = evalEnd - prevEvalT;
    prevEvalT = evalEnd;

    SequenceManager.current.update?.(SceneAPI, evalEnd, dtEval);

    const set = {};
    let changedAny = false;

    for (const p of panels){
      const rgba = readRGBA(p.id);
      const prev = lastColors.get(p.id);

      const changed = !prev
        || Math.abs(rgba[0] - prev[0]) > COLOR_EPS
        || Math.abs(rgba[1] - prev[1]) > COLOR_EPS
        || Math.abs(rgba[2] - prev[2]) > COLOR_EPS
        || Math.abs(rgba[3] - prev[3]) > COLOR_EPS;

      if (changed){
        lastColors.set(p.id, rgba);
        set[p.id] = { rgba: toExportRGBA(p.id, rgba), space: 'srgb' };
        changedAny = true;
      }
    }

    if (changedAny){
      pushEvent(bakedWallSpanSec, set);
    }
  }

  // ---- Build payload + save ----
  const payload = {
    fps,
    playbackRate,
    duration: +bakedWallSpanSec.toFixed(6),
    trimWindow: { startSec, stopSec },
    events
  };

  const json = JSON.stringify(payload, null, 2);

  try{
    if ('showSaveFilePicker' in window){
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{ description:'JSON', accept:{'application/json':['.json']} }],
      });
      const w = await handle.createWritable();
      await w.write(new Blob([json], {type:'application/json'}));
      await w.close();
      alert(`Baked → ${fileName}`);
      return;
    }
  }catch(e){
    console.warn('Picker failed; fallback download.', e);
  }

  // Fallback download
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href:url, download:fileName });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 500);

  console.log(`[Ripper] Bake JSON OK: fps=${fps}, playbackRate=${playbackRate}, duration=${payload.duration}s, events=${events.length}`);
}

function buildFullGeometry(mod){ const { domeMesh, buildGeometry } = mod; return buildGeometry(THREE, domeMesh); }
function buildSeparated(fullGeom, panels){
  const idx=fullGeom.getIndex().array;
  const keep=[]; for(const p of panels){ const s=p.start|0,e=s+(p.count|0); if(p.id[0].toUpperCase()==='T') keep.push([s,e]); }
  keep.sort((a,b)=>a[0]-b[0]); const merged=[]; for(const r of keep){ if(!merged.length||r[0]>merged.at(-1)[1]) merged.push(r); else merged.at(-1)[1]=Math.max(merged.at(-1)[1],r[1]); }
  let kept=0; for(const [s,e] of merged) kept+=(e-s);

  { let w=0; for(const [s,e] of merged){ newIndex.set(idx.subarray(s,e),w); w+=e-s; } }
  const gT=new THREE.BufferGeometry(); gT.setAttribute('position', fullGeom.getAttribute('position')); gT.setIndex(new THREE.BufferAttribute(newIndex,1)); gT.computeBoundingSphere();

  const pos=fullGeom.getAttribute('position').array, idxO=fullGeom.getIndex().array;
  const mk=(letter)=>{ const out=[]; for(const p of panels){ if(p.id[0].toUpperCase()!==letter) continue;
      const s=p.start|0,e=s+(p.count|0), edge=new Map();
      for(let i=s;i<e;i+=3){ const a=idxO[i]|0,b=idxO[i+1]|0,c=idxO[i+2]|0;
        for(const [u,v] of [[a,b],[b,c],[c,a]]){ const x=u<v?u:v,y=u<v?v:u,key=`${x}|${y}`; const rec=edge.get(key); rec?rec.count++:edge.set(key,{a:x,b:y,count:1}); } }
      for(const {a,b,count} of edge.values()) if(count===1){ const ia=a*3,ib=b*3; out.push(pos[ia],pos[ia+1],pos[ia+2], pos[ib],pos[ib+1],pos[ib+2]); }
    }
    const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(out),3)); g.computeBoundingSphere(); return g; };
  return { gT, gD:mk('D'), gL:mk('L') };
}
function triAreaAndCentroid(ax,ay,az,bx,by,bz,cx,cy,cz){
  const abx=bx-ax, aby=by-ay, abz=bz-az, acx=cx-ax, acy=cy-ay, acz=cz-az;
  const cxp=aby*acz - abz*acy, cyp=abz*acx - abx*acz, czp=abx*acy - aby*acx;
  const area=0.5*Math.hypot(cxp,cyp,czp);
  return { area, cx:(ax+bx+cx)/3, cy:(ay+by+cy)/3, cz:(az+bz+cz)/3 };
}
function computePanelCentroids(fullGeom, panels){
  const pos=fullGeom.getAttribute('position').array, idx=fullGeom.getIndex().array, out=[];
  for(const p of panels){
    const s=p.start|0,e=s+(p.count|0); let sumA=0,sx=0,sy=0,sz=0;
    for(let i=s;i<e;i+=3){
      const ia=(idx[i]|0)*3, ib=(idx[i+1]|0)*3, ic=(idx[i+2]|0)*3;
      const {area,cx,cy,cz}=triAreaAndCentroid(pos[ia],pos[ia+1],pos[ia+2], pos[ib],pos[ib+1],pos[ib+2], pos[ic],pos[ic+1],pos[ic+2]);
      if(area>0){ sumA+=area; sx+=area*cx; sy+=area*cy; sz+=area*cz; }
    }
    if(sumA>0) out.push({id:p.id, center:new THREE.Vector3(sx/sumA, sy/sumA, sz/sumA)});
    else { const box=new THREE.Box3().makeEmpty(); for(let i=s;i<e;i++){ const iv=(idx[i]|0)*3; _v.set(pos[iv],pos[iv+1],pos[iv+2]); box.expandByPoint(_v); }
           const c=new THREE.Vector3(); box.getCenter(c); out.push({id:p.id,center:c}); }
  }
  return out;
}
function buildPanelHitBoxes(fullGeom, panels){

  for(const p of panels){
    const s=p.start|0,e=s+(p.count|0); const box=new THREE.Box3().makeEmpty();
    for(let i=s;i<e;i++){ const vi=idx[i]*3; _v.set(pos[vi],pos[vi+1],pos[vi+2]); box.expandByPoint(_v); }
    const c=new THREE.Vector3(); box.getCenter(c); boxes.push({box,id:p.id,center:c});
  }

function makeDotTexture(){ const S=64,c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d'); g.clearRect(0,0,S,S); g.beginPath(); g.arc(S/2,S/2,S*0.45,0,Math.PI*2); g.fillStyle='#fff'; g.fill(); const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter; tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping; return tex; }
function buildCentroidsPoints(centers, size=3){

  for(const {id,center} of centers){ const tag=id[0].toUpperCase(); (tag==='T'?tPos:tag==='D'?dPos:lPos).push(center.x,center.y,center.z); }
  const mk=(arr,color)=>{ const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(arr),3));
    const m=new THREE.PointsMaterial({size, sizeAttenuation:false, color, map:dotTexture, transparent:true, alphaTest:0.5, depthWrite:true}); return new THREE.Points(g,m); };

  // Long lines within camera far: far = rad * 100 (set later). Use 0.9*far.
  const far = Math.max(500, rad*100);
  const L = far * 0.9;
  const make = (dx,dy,dz,color)=> {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      center.x - dx, center.y - dy, center.z - dz,
      center.x + dx, center.y + dy, center.z + dz
    ]),3));
    const m = new THREE.LineBasicMaterial({ color });
    return new THREE.LineSegments(g,m);
  };
  const X = make(L,0,0, 0xff3a3a);
  const Y = make(0,L,0, 0x32ff32);
  const Z = make(0,0,L, 0x3a8bff);
  const g = new THREE.Group(); g.add(X,Y,Z); return g;
}
function buildPreviewMesh(fullGeom){
  const pos=fullGeom.getAttribute('position');
  const colors=new Float32Array(pos.count*4);
  const g=new THREE.BufferGeometry(); g.setAttribute('position',pos); g.setIndex(fullGeom.getIndex()); g.setAttribute('color', new THREE.BufferAttribute(colors,4));
  const m=new THREE.MeshBasicMaterial({ vertexColors:true, transparent:true, depthWrite:false, side:THREE.DoubleSide });
  const mesh=new THREE.Mesh(g,m); mesh.visible=false; return mesh;
}
function applyPreviewColors(){
  if (!previewMesh || !domeMeta) return;

  const inPreview = (modeSel.value === 'preview');
  const colors = previewMesh.geometry.getAttribute('color').array;
  const idx = fullGeom.getIndex().array;

  for (const p of domeMeta.panels){
    // base rgba from SceneAPI (linear)
    const src = SceneAPI._rgbaById.get(p.id) || [1,1,1,1];
    let r = src[0], g = src[1], b = src[2];

    // default alpha is 1 unless explicitly set
    let a = SceneAPI._explicitAlpha.has(p.id) ? clamp01(src[3]) : 1.0;

    // In Preview ONLY: respect Dev toggles for T/D/L by zeroing alpha
    if (inPreview){
      const tag = p.id[0].toUpperCase();
      if (tag === 'T' && !visT.checked) a = 0;
      else if (tag === 'D' && !visD.checked) a = 0;
      else if (tag === 'L' && !visL.checked) a = 0;
    }

    // write per-vertex RGBA for this panel's indices
    for (let i=p.start|0, end=(p.start|0)+(p.count|0); i<end; i++){
      const vi = (idx[i]|0) * 4;
      colors[vi+0]=r; colors[vi+1]=g; colors[vi+2]=b; colors[vi+3]=a;
    }
  }
  previewMesh.geometry.getAttribute('color').needsUpdate = true;
}



function applyFaceMode(){
  if(!previewMesh) return;
  const v=faceMode.value;
  if (v==='front') previewMesh.material.side = THREE.FrontSide;
  else if (v==='back') previewMesh.material.side = THREE.BackSide;
  else previewMesh.material.side = THREE.DoubleSide;
  previewMesh.material.needsUpdate=true;
}



/* Picking + readouts */
function setHud(id){ if(id===lastPanelId) return; lastPanelId=id; idHud.textContent='ID: ' + (id ?? '—'); }
const _ndc = new THREE.Vector2();
function onPointerMove(ev){
  if(!panelBoxes.length) return;
  const rect=renderer.domElement.getBoundingClientRect();
  _ndc.set(((ev.clientX-rect.left)/rect.width)*2-1, -((ev.clientY-rect.top)/rect.height)*2+1);
  const ray=new THREE.Ray(); ray.origin.copy(camera.position);
  ray.direction.set(_ndc.x,_ndc.y,0.5).unproject(camera).sub(camera.position).normalize();
  let best=null, bestD=Infinity; const tmp=new THREE.Vector3();
  for(const {box,id} of panelBoxes){ const hit=ray.intersectBox(box,tmp); if(hit){ const d=camera.position.distanceToSquared(hit); if(d<bestD){ bestD=d; best=id; } } }
  setHud(best||null);
}

const rad2deg=r=>r*180/Math.PI;
function updateAngleHud(){
  if(modeSel.value!=='dev'){ angHud.classList.add('hidden'); return; }
  angHud.classList.remove('hidden');
  const az=rad2deg(controls.getAzimuthalAngle()), pol=rad2deg(controls.getPolarAngle());
  const el=90-pol, dist=camera.position.distanceTo(controls.target);
  angHud.textContent=`az: ${az.toFixed(1)}°  el: ${el.toFixed(1)}°  dist: ${dist.toFixed(2)}`;
}

/* ---------- bootstrap ---------- */

function initRenderer(){
  renderer=new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  // BACKGROUND COLOR
  renderer.setClearColor('rgb(20,20,20)',1);
  //renderer.setClearColor('rgb(28,28,28)',1);
  app.appendChild(renderer.domElement);

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 5000);

  controls=new OrbitControls(camera, renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.06;
  controls.minDistance=0.1; controls.maxDistance=2000; controls.autoRotate=false;

  window.addEventListener('resize', ()=>{ 
    camera.aspect=innerWidth/innerHeight; 
    camera.updateProjectionMatrix(); 
    renderer.setSize(innerWidth,innerHeight); 
    updateAngleHud(); 
  });

  renderer.setAnimationLoop(()=>{ Engine.tick(); controls.update(); renderer.render(scene,camera); updateAngleHud(); });
  
}


/* ---------------- */

function disposeObject3D(root){
  if (!root) return;
  root.traverse?.(obj=>{
    const g = obj.geometry;
    if (g && g.dispose) g.dispose();

    const m = obj.material;
    if (Array.isArray(m)) m.forEach(x=>x?.dispose?.());
    else m?.dispose?.();
  });
}



function addBaked(mod){
  [dev_T_mesh,dev_D_lines,dev_L_lines,previewMesh,centroidsGroup,crosshair,axisLines].forEach(o=>{
  if (!o) return;
    scene.remove(o);
    disposeObject3D(o);
  });
  if (domeRoot){ scene.remove(domeRoot); domeRoot.clear(); domeRoot = null; }
  dev_T_mesh=dev_D_lines=dev_L_lines=previewMesh=centroidsGroup=crosshair=axisLines=null;
  panelBoxes.length=0; lastPanelId=null;

  const { domeMesh, buildGeometry } = mod;
  domeMeta = domeMesh;
  fullGeom = buildGeometry(THREE, domeMesh);
  fullGeom.computeBoundingSphere();

  const { gT,gD,gL } = buildSeparated(fullGeom, domeMeta.panels);

  // DEV visuals: magenta / yellow / orange (as before)
  dev_T_mesh = new THREE.Mesh(gT, new THREE.MeshBasicMaterial({ color:0xff00ff, wireframe:true }));
  dev_D_lines = new THREE.LineSegments(gD, new THREE.LineBasicMaterial({ color:0xffff00 }));
  dev_L_lines = new THREE.LineSegments(gL, new THREE.LineBasicMaterial({ color:0xff7f00 }));
  scene.add(dev_T_mesh, dev_D_lines, dev_L_lines);

  panelBoxes = buildPanelHitBoxes(fullGeom, domeMeta.panels);

  // ids
  SceneAPI.ids.T = domeMeta.panels.filter(p=>p.id[0].toUpperCase()==='T').map(p=>p.id);
  SceneAPI.ids.D = domeMeta.panels.filter(p=>p.id[0].toUpperCase()==='D').map(p=>p.id);
  SceneAPI.ids.L = domeMeta.panels.filter(p=>p.id[0].toUpperCase()==='L').map(p=>p.id);

  const centers = computePanelCentroids(fullGeom, domeMeta.panels);
  centroidsGroup = buildCentroidsPoints(centers, 3); scene.add(centroidsGroup);

  const center = (fullGeom?.boundingSphere?.center?.clone?.())
    ?? new THREE.Vector3(...domeMeta.center);
  const rad = fullGeom.boundingSphere?.radius || 1;

  previewMesh = buildPreviewMesh(fullGeom); scene.add(previewMesh);

  // Tiny white crosshair + long RGB axis lines
  crosshair = buildCrosshair(center, rad); scene.add(crosshair);
  axisLines = buildAxisLines(center, rad); scene.add(axisLines);

  // Create a pivot at the dome center and reparent visuals under it
  domeRoot = new THREE.Group();
  domeRoot.position.copy(center);
  scene.add(domeRoot);

  // Preserve world transforms while parenting under the pivot
  if (dev_T_mesh) domeRoot.attach(dev_T_mesh);
  if (dev_D_lines) domeRoot.attach(dev_D_lines);
  if (dev_L_lines) domeRoot.attach(dev_L_lines);
  if (previewMesh) domeRoot.attach(previewMesh);
  if (centroidsGroup) domeRoot.attach(centroidsGroup);
  if (crosshair) domeRoot.attach(crosshair);
  if (axisLines) domeRoot.attach(axisLines);

  SceneAPI.info = { center:{ x:center.x, y:center.y, z:center.z }, radius: rad };

  const dist=Math.max(0.5, rad*2.4);
  camera.near = Math.max(0.01, rad*0.01);
  camera.far  = Math.max(camera.far, rad*100); // ensure axis lines render
  camera.updateProjectionMatrix();

  const camOffset=new THREE.Vector3().setFromSpherical(new THREE.Spherical(dist, START_POLAR, START_AZ));
  controls.target.copy(center); camera.position.copy(center).add(camOffset); camera.lookAt(controls.target); controls.update();

  SceneAPI.resetColorsTo([1,1,1,1]); applyPreviewColors(); setMode(modeSel.value);
}

/* ---------- UI wiring ---------- */
if (!window.__RIPPER_UI_WIRED__) {
  window.__RIPPER_UI_WIRED__ = true;

  modeSel.addEventListener('change', ()=> setMode(modeSel.value));

  [visT,visD,visL,visC].forEach(el => el.addEventListener('change', () => {
    if (modeSel.value === 'dev') {
      if (dev_T_mesh)  dev_T_mesh.visible  = visT.checked;
      if (dev_D_lines) dev_D_lines.visible = visD.checked;
      if (dev_L_lines) dev_L_lines.visible = visL.checked;
      syncCentroidVisibility();
    } else {
      if (previewMesh) previewMesh.visible = (modeSel.value === 'preview');
    }
  }));

  faceMode.addEventListener('change', ()=>{ applyFaceMode(); });
  seqSel.addEventListener('change', ()=> SequenceManager.loadById(seqSel.value));
  loadBtn.addEventListener('click', ()=> SequenceManager.loadById(seqSel.value));

  playBtn?.addEventListener('click', ()=>{
    if (Engine.playing) Engine.pause();
    else Engine.play();
    Engine.syncTransportUI();
    syncPlayToggleUI();
  });

  bakeBtn.addEventListener('click', bakeToJSON);
}

/* ---------- boot ---------- */

function init(){
  initRenderer();
  addBaked(DOME);
  SequenceManager.discover();
  window.addEventListener('pointermove', onPointerMove, { passive:true });
  setMode('preview');             // default start: Preview
  faceMode.value = 'front';       // Preview default = Front
  applyFaceMode();
}
init();

</script>
